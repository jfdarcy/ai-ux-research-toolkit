name: Feedback or suggestion
description: Share an idea, UX note, or improvement for the toolkit
title: "[Feedback]: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the feedback. This is a portfolio demo — I read suggestions when I can.

        **Do not paste confidential or client research material.**

  - type: dropdown
    id: tool
    attributes:
      label: Which tool is this about?
      options:
        - Interview Refiner (live)
        - Portfolio site (GitHub Pages)
        - Research Plan Challenger (concept)
        - Transcript Dual-Lens Analyzer (concept)
        - Insight Rigidity Checker (concept)
        - Toolkit overall
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What would make this more useful, clearer, or more rigorous?
      placeholder: e.g. The gap analysis report could call out leading questions more explicitly in a dedicated section.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context (optional)
      description: How you were using the tool — keep it general, no client or participant details.
